name: image

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:
    paths-ignore: ['**/*.md']
  workflow_dispatch:
    inputs:
      zeroshot_ref:
        description: zeroshot branch or tag to build against
        default: feat/hub

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  ZEROSHOT_REPO: https://github.com/naqerl/zeroshot.git
  ZEROSHOT_REF: ${{ github.event.inputs.zeroshot_ref || 'feat/hub' }}
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A broken graph template must never reach a published image.
      - name: Verify graph template
        run: |
          chmod +x scripts/verify-template.sh
          ./scripts/verify-template.sh

      - name: Build
        run: |
          chmod +x build.sh
          TAG="${IMAGE}:${GITHUB_SHA::12}" ./build.sh

      # The image's ENTRYPOINT is the zeroshot target launcher, so every check must override it.
      - name: Smoke test
        run: |
          image="${IMAGE}:${GITHUB_SHA::12}"
          docker run --rm --entrypoint pi "$image" --version
          docker run --rm --entrypoint cat "$image" /opt/zeroshot/pi-extensions/list
          docker run --rm --entrypoint sh "$image" -c 'head -3 /usr/local/bin/restic && restic version'
          # The Go side of the image: a Go repository has to build and generate on a target.
          docker run --rm --entrypoint sh "$image" -c 'go version && templ --help >/dev/null && sqlc version && tailwindcss --help >/dev/null && cargo --version && cargo llvm-cov --version'

      - name: Tag and push
        if: github.event_name != 'pull_request'
        run: |
          docker tag "${IMAGE}:${GITHUB_SHA::12}" "${IMAGE}:latest"
          docker push "${IMAGE}:${GITHUB_SHA::12}"
          docker push "${IMAGE}:latest"
