name: image

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:
    paths-ignore: ['**/*.md']
  workflow_dispatch:
    inputs:
      zeroshot_ref:
        description: zeroshot branch or tag to build against
        default: feat/hub

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  ZEROSHOT_REPO: https://github.com/naqerl/zeroshot.git
  ZEROSHOT_REF: ${{ github.event.inputs.zeroshot_ref || 'feat/hub' }}
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: |
          chmod +x build.sh
          TAG="${IMAGE}:${GITHUB_SHA::12}" ./build.sh

      - name: Tag and push
        if: github.event_name != 'pull_request'
        run: |
          docker tag "${IMAGE}:${GITHUB_SHA::12}" "${IMAGE}:latest"
          docker push "${IMAGE}:${GITHUB_SHA::12}"
          docker push "${IMAGE}:latest"

      - name: Smoke test
        run: |
          docker run --rm "${IMAGE}:${GITHUB_SHA::12}" pi --version
          docker run --rm "${IMAGE}:${GITHUB_SHA::12}" cat /opt/zeroshot/pi-extensions/list
          docker run --rm "${IMAGE}:${GITHUB_SHA::12}" sh -c 'head -3 /usr/local/bin/restic'
