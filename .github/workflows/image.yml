name: image

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:
    paths-ignore: ['**/*.md']
  workflow_dispatch:
    inputs:
      zeroshot_ref:
        description: zeroshot branch or tag to build against
        default: integrate/hub-all

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  ZEROSHOT_REPO: https://github.com/naqerl/zeroshot.git
  ZEROSHOT_REF: ${{ github.event.inputs.zeroshot_ref || 'integrate/hub-all' }}
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The tag must name the zeroshot code baked into the image, not this repository's sha.
      - name: Resolve the compiled ref
        run: |
          resolved=$(git ls-remote "${ZEROSHOT_REPO}" "${ZEROSHOT_REF}" | awk '{print $1}' | head -1)
          if [ -z "$resolved" ]; then
            case "${ZEROSHOT_REF}" in
              [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]*) resolved="${ZEROSHOT_REF}" ;;
              *) echo "cannot resolve ${ZEROSHOT_REF} in ${ZEROSHOT_REPO}" >&2; exit 1 ;;
            esac
          fi
          echo "ZEROSHOT_SHA=${resolved}" >> "$GITHUB_ENV"
          echo "compiled from ${ZEROSHOT_REPO} ${ZEROSHOT_REF} -> ${resolved}"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A broken graph template must never reach a published image.
      - name: Verify graph templates
        run: |
          chmod +x scripts/verify-template.sh
          ./scripts/verify-template.sh templates/software-change.json

      - name: Build
        run: |
          chmod +x build.sh
          TAG="${IMAGE}:${ZEROSHOT_SHA::12}" ./build.sh

      # The image's ENTRYPOINT is the zeroshot target launcher, so every check must override it.
      - name: Smoke test
        run: |
          image="${IMAGE}:${ZEROSHOT_SHA::12}"
          docker run --rm --entrypoint pi "$image" --version
          docker run --rm --entrypoint cat "$image" /opt/zeroshot/pi-extensions/list
          docker run --rm --entrypoint sh "$image" -c 'head -3 /usr/local/bin/restic && restic version'
          # The Go side of the image: a Go repository has to build and generate on a target.
          docker run --rm --entrypoint sh "$image" -c 'go version && templ --help >/dev/null && sqlc version && tailwindcss --help >/dev/null && cargo --version && cargo llvm-cov --version'

      - name: Tag and push
        if: github.event_name != 'pull_request'
        run: |
          short="${ZEROSHOT_SHA::12}"
          branch="$(echo "${ZEROSHOT_REF}" | tr '/_' '--' | sed -E 's/[^A-Za-z0-9.-]+/-/g')"
          docker tag "${IMAGE}:${short}" "${IMAGE}:zs-${short}"
          docker tag "${IMAGE}:${short}" "${IMAGE}:latest"
          docker push "${IMAGE}:zs-${short}"
          docker push "${IMAGE}:latest"
          docker tag "${IMAGE}:${short}" "${IMAGE}:ref-${branch}"
          docker push "${IMAGE}:ref-${branch}"
          {
            echo "published \`${IMAGE}:zs-${short}\` (alias \`ref-${branch}\`)"
            echo
            echo "| what | value |"
            echo "| --- | --- |"
            echo "| zeroshot ref | \`${ZEROSHOT_REF}\` |"
            echo "| compiled commit | \`${ZEROSHOT_SHA}\` |"
            echo "| workflow commit | \`${GITHUB_SHA}\` |"
            echo
            docker buildx imagetools inspect "${IMAGE}:zs-${short}" | sed -n '1,20p'
          } >> "$GITHUB_STEP_SUMMARY"
